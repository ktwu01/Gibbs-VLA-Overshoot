[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gibbs-vla-overshoot"
version = "0.1.0"
description = "Gibbs phenomenon and spectral analysis for VLA trajectories"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "PyWavelets>=1.5",
]

[tool.setuptools.packages.find]
include = ["analysis*", "models*"]
